services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: docsy-builder:latest
    container_name: builder
    working_dir: /work
    volumes:
      - .:/work:ro
      - site:/site
    environment:
      DOCSY_PROJECT: "${DOCSY_PROJECT:-Purdue CYAN Lab}"
      DOCSY_THEME: "${DOCSY_THEME:-sphinx_rtd_theme}"
    command: ["sh", "-c", "sphinx-build -b html -d /tmp/doctrees docs/source /site && tail -f /dev/null"]
    networks:
      - docs
    healthcheck:
      test: ["CMD", "test", "-f", "/site/index.html"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    profiles:
      - "prod"


  web:
    image: nginx:1.27-alpine
    container_name: web
    depends_on:
      builder:
        condition: service_healthy
    volumes:
      - site:/site:ro
      - ops:/var/cache/nginx
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOCS_PORT:-8080}:80"
    networks:
      - docs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - "prod"

  dev:
    image: docsy-builder:latest
    pull_policy: never
    container_name: dev
    working_dir: /work
    profiles:
      - "dev"
    environment:
      BUILD_DIR: /site
      DOCSY_PROJECT: "${DOCSY_PROJECT:-Purdue CYAN Lab}"
      DOCSY_THEME: "${DOCSY_THEME:-sphinx_rtd_theme}"
    command: > 
      sh -c "sphinx-autobuild --host 0.0.0.0 --port 8000 -d /tmp/doctrees docs/source $${BUILD_DIR}"
    volumes:
      - .:/work:ro
      - site:/site
    ports:
      - "8000:8000"
    networks:
      - docs
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v10.10.0
    profiles: ["obs"]
    ports:
      - "127.0.0.1:9000:8080"   # bind to localhost only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [docs]

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:0.60.5
    profiles: ["obs"]
    privileged: true            # required by cAdvisor for full container metrics
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:9100:8080"   # bind to localhost only
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [docs]

volumes:
  site:
    name: site
  ops:
    name: ops

networks:
  docs:
    driver: bridge