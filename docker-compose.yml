services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: docsy-builder:latest
    container_name: builder
    working_dir: /work
    volumes:
      - .:/work:ro
      - site:/site
    environment:
      DOCSY_PROJECT: "${DOCSY_PROJECT:-Purdue CYAN Lab}"
      DOCSY_THEME: "${DOCSY_THEME:-sphinx_rtd_theme}"
    command: ["sh", "-c", "sphinx-build -b html -d /tmp/doctrees docs/source /site && tail -f /dev/null"]
    networks:
      - docs
    healthcheck:
      test: ["CMD", "test", "-f", "/site/index.html"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  web:
    image: nginx:1.27-alpine
    container_name: web
    depends_on:
      builder:
        condition: service_healthy
    volumes:
      - site:/site:ro
      - ops:/var/cache/nginx
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOCS_PORT:-8080}:80"
    networks:
      - docs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  site:
    name: site
  ops:
    name: ops

networks:
  docs:
    driver: bridge